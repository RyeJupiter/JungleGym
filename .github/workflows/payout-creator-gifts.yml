name: Payout creator gifts (monthly)

# Bundles each creator's unsettled gifts into a Stripe Transfer and marks
# them settled. Hits /api/cron/payout-creator-gifts with a Bearer token.
#
# Setup: requires CRON_SECRET as both a GH repo secret AND a Worker secret
# (set via `wrangler secret put CRON_SECRET --name junglegym`). Same secret
# as the purge-deleted-videos cron.

on:
  schedule:
    - cron: '0 4 1 * *' # 1st of each month at 04:00 UTC
  workflow_dispatch: {} # manual trigger for testing

jobs:
  payout:
    name: Payout creator gifts
    runs-on: ubuntu-latest
    steps:
      - name: Call payout endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in GitHub secrets"
            exit 1
          fi
          response=$(curl -s -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://junglegym.academy/api/cron/payout-creator-gifts)
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $status"
          echo "$body" | head -c 8000
          if [ "$status" != "200" ]; then
            echo "::error::Payout request failed with status $status"
            exit 1
          fi
